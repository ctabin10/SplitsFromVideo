<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SplitsFromVideo</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header-bar">
            <button id="aboutBtn" class="btn btn-secondary">About</button>
            <h1 class="app-title">SplitsFromVideo</h1>
            <div class="nav-group">
                <button id="howToUseBtn" class="btn btn-secondary">How to use</button>
                <button id="settingsBtn" class="btn btn-secondary">Settings</button>
            </div>
        </header>

        <!-- URL Input Section -->
        <section class="url-section">
            <label for="urlInput">Input YouTube URL:</label>
            <input type="text" id="urlInput" class="input-field" placeholder="https://youtube.com/watch?v=...">
        </section>

        <!-- Main Layout Grid -->
        <main class="main-grid">
            <!-- Left Column: Video & Controls -->
            <div class="left-column">
                <div class="video-preview-card" id="videoPreview">
                    <iframe 
                        id="videoPlayer" 
                        src="about:blank" 
                        title="YouTube video player" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                    </iframe>
                </div>
                <div class="options-row">
                    <select id="formatSelect" class="select-field">
                        <option value="" disabled selected>Format Select</option>
                        <option value="lss">Splits File</option>
                        <option value="csv">CSV</option>
                        <option value="txt">Text</option>
                    </select>
                    <input type="text" id="fileNameInput" class="input-field" placeholder="File name input">
                </div>

                <button id="downloadBtn" class="btn btn-primary">Download</button>
            </div>

            <!-- Right Column: Splits List -->
            <aside class="splits-panel">
                <h2 class="splits-header">Splits:</h2>
                <ul class="splits-list" id="splitsList">
                    <li class="split-item">4:30.94</li>
                    <li class="split-item">4:18.51</li>
                    <li class="split-item">3:08.33</li>
                    <li class="split-item">2:28.03</li>
                    <li class="split-item">4:15.70</li>
                    <li class="split-item">5:35.46</li>
                    <li class="split-item">3:01.97</li>
                    <li class="split-item">2:36.64</li>
                    <li class="split-item">3:08.14</li>
                    <li class="split-item">3:34.57</li>
                    <li class="split-item">2:55.49</li>
                    <li class="split-item">5:35.87</li>
                    <li class="split-item">2:50.45</li>
                    <li class="split-item">2:56.54</li>
                    <li class="split-item">1:39.33</li>
                    <li class="split-item">2:38.28</li>
                    <li class="split-item">5:37.55</li>
                    <li class="split-item">2:03.08</li>
                </ul>
            </aside>
        </main>
    </div>
</body>
</html>
