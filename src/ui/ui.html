<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplitsFromVideo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #333333;
      padding: 20px;
      user-select: none;
    }

    /* Top Header Bar */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .title {
      font-size: 32px;
      font-weight: 400;
      letter-spacing: -0.5px;
    }

    .btn-dark {
      background-color: #4a4a4a;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-dark:hover {
      background-color: #333333;
    }

    .header-right {
      display: flex;
      gap: 12px;
    }

    /* URL Input Section */
    .url-section {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .url-section label {
      font-size: 16px;
      font-weight: 500;
    }

    .url-section input {
      padding: 6px 10px;
      font-size: 14px;
      border: 1px solid #767676;
      border-radius: 2px;
      width: 280px;
      outline: none;
    }

    /* Main Grid Layout */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 30px;
    }

    /* Left Side: Video & Options */
    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .video-placeholder {
      width: 100%;
      height: 280px;
      background-color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 2px;
    }

    .video-placeholder svg {
      width: 100px;
      height: 100px;
      fill: #bbbbbb;
    }

    .controls-row {
      display: flex;
      gap: 20px;
    }

    .select-input, .text-input {
      padding: 8px 12px;
      border: 1px solid #767676;
      border-radius: 4px;
      font-size: 14px;
      background-color: #ffffff;
      outline: none;
      width: 160px;
    }

    .download-btn {
      width: fit-content;
      margin-top: 10px;
      padding: 10px 30px;
    }

    /* Right Side: Splits Display */
    .right-panel {
      border: 1px solid #333333;
      padding: 15px 20px;
      height: 380px;
      overflow-y: auto;
    }

    .splits-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .splits-list {
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 14px;
      color: #333333;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <button class="btn-dark" onclick="handleAbout()">About</button>
    <h1 class="title">SplitsFromVideo</h1>
    <div class="header-right">
      <button class="btn-dark" onclick="handleHowToUse()">How to use</button>
      <button class="btn-dark" onclick="handleSettings()">Settings</button>
    </div>
  </div>

  <!-- URL Input -->
  <div class="url-section">
    <label for="youtube-url">Input YouTube URL:</label>
    <input type="text" id="youtube-url" placeholder="" onchange="handleUrlChange(this.value)">
  </div>

  <!-- Main Content Layout -->
  <div class="main-content">
    
    <!-- Left Column -->
    <div class="left-panel">
      <!-- Media Player Placeholder -->
      <div class="video-placeholder" id="video-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
        </svg>
      </div>

      <!-- Controls Row -->
      <div class="controls-row">
        <select class="select-input" id="format-select" onchange="handleFormatSelect(this.value)">
          <option value="" disabled selected hidden>Format Select</option>
          <option value="txt">.txt</option>
          <option value="csv">.csv</option>
          <option value="json">.json</option>
        </select>

        <input type="text" class="text-input" id="filename-input" placeholder="File name input" onkeyup="handleFileNameInput(this.value)">
      </div>

      <!-- Download Button -->
      <button class="btn-dark download-btn" onclick="handleDownload()">Download</button>
    </div>

    <!-- Right Column: Splits List -->
    <div class="right-panel">
      <div class="splits-title">Splits:</div>
      <ul class="splits-list" id="splits-list">
        <li>4:30.94</li>
        <li>4:18.51</li>
        <li>3:08.33</li>
        <li>2:28.03</li>
        <li>4:15.70</li>
        <li>5:35.46</li>
        <li>3:01.97</li>
        <li>2:36.64</li>
        <li>3:08.14</li>
        <li>3:34.57</li>
        <li>2:55.49</li>
        <li>5:35.87</li>
        <li>2:50.45</li>
        <li>2:56.54</li>
        <li>1:39.33</li>
        <li>2:38.28</li>
        <li>5:37.55</li>
        <li>2:03.08</li>
      </ul>
    </div>

  </div>

  <script>
    /* =========================================================================
       TEMPLATE HANDLER FUNCTIONS
       Call Python backend methods using `pywebview.api.<method_name>()`
       ========================================================================= */

    function handleAbout() {
      console.log('About button clicked');
      if (window.pywebview) {
        pywebview.api.on_about_clicked();
      }
    }

    function handleHowToUse() {
      console.log('How to use button clicked');
      if (window.pywebview) {
        pywebview.api.on_how_to_use_clicked();
      }
    }

    function handleSettings() {
      console.log('Settings button clicked');
      if (window.pywebview) {
        pywebview.api.on_settings_clicked();
      }
    }

    function handleUrlChange(url) {
      console.log('URL updated:', url);
      if (window.pywebview) {
        pywebview.api.on_url_changed(url);
      }
    }

    function handleFormatSelect(format) {
      console.log('Format selected:', format);
      if (window.pywebview) {
        pywebview.api.on_format_selected(format);
      }
    }

    function handleFileNameInput(filename) {
      console.log('Filename input:', filename);
      if (window.pywebview) {
        pywebview.api.on_filename_changed(filename);
      }
    }

    function handleDownload() {
      const url = document.getElementById('youtube-url').value;
      const format = document.getElementById('format-select').value;
      const filename = document.getElementById('filename-input').value;

      console.log('Download initiated:', { url, format, filename });

      if (window.pywebview) {
        pywebview.api.on_download_clicked({
          url: url,
          format: format,
          filename: filename
        });
      }
    }

    /* Helper function you can call from Python to populate splits */
    function updateSplits(splitsArray) {
      const splitsList = document.getElementById('splits-list');
      splitsList.innerHTML = '';
      splitsArray.forEach(split => {
        const li = document.createElement('li');
        li.textContent = split;
        splitsList.appendChild(li);
      });
    }
  </script>
</body>
</html>
