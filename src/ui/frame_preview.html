<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame Preview</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/frame_preview.js" defer></script>
</head>
<body class="frame-preview-body">
    <div class="frame-preview-container">
        <img class="frame-preview-img" src="" alt="Loading..." />
    </div>

    <div class="frame-controls-bar">
        <label for="timeInput">Input detailed timer value</label>
        <input type="text" id="timeInput" placeholder="00:00.000" pattern="^(?:(?:([01]?\d|2[0-3]):)?([0-5]?\d):)?([0-5]?\d)$" title="Enter time as MM:SS or HH:MM:SS">
        <button id="nextFrameBtn" class="btn btn-primary">Next frame</button>
        <button id="recordSplitBtn" class="btn btn-primary">Record split</button>
    </div>
</body>
</html>
