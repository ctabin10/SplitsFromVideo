<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame Preview</title>
    <style>{{CSS_CONTENT}}</style> 
</head>
<body class="frame-preview-body">
    <div class="frame-preview-container">
        <img class="frame-preview-img" src="{{FRAME_DATA}}" alt="Frame {{FRAME_NUMBER}}" />
    </div>

    <div class="frame-controls-bar">
        <button class="btn btn-primary" onclick="window.close()">Close</button>
    </div>
</body>
</html>
